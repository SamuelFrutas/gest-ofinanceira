name: Publicar Gestão Financeira no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Validar JavaScript
        run: |
          node --check app.js
          for f in js/*.js; do node --check "$f"; done
      - name: Renovar cache dos scripts
        run: |
          sed -i "s#src=\"app.js\"#src=\"app.js?v=${GITHUB_SHA}\"#" index.html
          sed -i "s#src=\"js/auth.js\"#src=\"js/auth.js?v=${GITHUB_SHA}\"#" index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
